# @package _global_
# RGB (scene-cam) Diffusion Policy: image + robot proprioception only (NO privileged state).
# ResNet18 + SpatialSoftmax encoder, DrQ random-shift aug, clipped demo actions, fp16 encoder.
# Level preset: medium demos, 500-step episodes for the training-time eval.
#   python il/train.py method=dp_rgb_medium                      # (+ flags.ckpt_dir=/content/drive/... on Colab)
baseline_dir: diffusion_policy
script: train_rgbd.py
demo_kind: rgb
demo_dir: medium
max_episode_steps: 500
flags:
  obs_mode: rgb
  obs_camera: scene
  visual_encoder: resnet18   # resnet18 | plain_conv
  num_kp: 32
  total_iters: 30000
  batch_size: 128
  lr: 1.0e-4
  obs_horizon: 2
  act_horizon: 8
  pred_horizon: 16
  num_diffusion_iters: 100
  eval_inference_steps: 16   # also the deployment default stored in the checkpoint config
  clip_actions: true
  image_aug_pad: 4
  proprio_noise_std: 0.0
  amp: true
  torch_deterministic: false
  num_eval_envs: 8
  num_eval_episodes: 32
  eval_freq: 5000
  skip_initial_eval: true
  log_freq: 500
  save_freq: 2500
  capture_video: false       # RecordEpisode buffers whole episodes in RAM -> OOM on Colab
  num_demos: null            # per file; null = all 200
  ckpt_dir: null             # e.g. /content/drive/MyDrive/marso/ckpts/<exp>; null = runs/<exp>/checkpoints
  resume: null               # path to latest.pt to continue a run (same hyperparameters)
  exp_name_timestamp: false  # append _MMDD-HHMM to exp_name
  exp_name: rgb_dp_medium
