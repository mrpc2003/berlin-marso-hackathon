# @package _global_
difficulty:
  name: medium
  num_parcels: 4
  fixed_poses: false
  max_episode_steps: 500   # demos need ~236 steps (max 238); placement is sticky, so generous is safe

randomization:
  parcel_pose:
    xy_jitter: [-0.015, 0.015]     # small spawn jitter within the inbound zone (m)
    yaw_jitter: [0.0, 0.0]         # fixed orientation (boxes always axis-aligned)
  bin_position:
    side_swap_prob: 0.0
    xy_jitter: [0.0, 0.0]
